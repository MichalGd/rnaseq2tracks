# rnaseq2tracks configuration
# Copy this file beside your samplesheet, edit the paths, and launch with:
#   rnaseq2tracks --config /absolute/path/to/config.conf
# Relative paths are resolved from the directory containing this file.

# Project
PROJECT_ID="my_rnaseq_project"
SPECIES="mouse"                  # mouse | human
GENOME_ASSEMBLY="GRCm39"        # descriptive metadata
LIBRARY_LAYOUT="PE"             # PE | SE
SAMPLESHEET="samplesheet.csv"
# Optional: set a CSV path to restrict or reorder comparisons. When unset,
# every unique pair of samplesheet conditions is compared automatically.
# CONTRASTS="contrasts.csv"
OUTDIR="../results"

# Genome resources: fill the species used by this project.
STAR_INDEX_HUMAN=""
GTF_HUMAN=""
CHROM_SIZES_HUMAN=""
RSEQC_BED_HUMAN=""

STAR_INDEX_MOUSE=""
GTF_MOUSE=""
CHROM_SIZES_MOUSE=""
RSEQC_BED_MOUSE=""

# Track coordinate policy
REGULAR_CHROMS_ONLY="true"
CHROMOSOME_NAMING="ucsc"         # ucsc | ensembl
KENTUTILS_DIR=""                 # directory containing bedGraphToBigWig
TMPDIR="/tmp"

# Resource controls. MAX_JOBS limits concurrent per-lane/per-sample jobs.
# Approximate peak STAR threads = MAX_JOBS * STAR_THREADS.
MAX_JOBS=4
STAR_THREADS=12
SAMTOOLS_THREADS=4
FASTQC_THREADS=4
FASTQSCREEN_THREADS=4
FASTQSCREEN_SUBSET=200000

# Trimming
TRIM_QUALITY=20
TRIM_MIN_LENGTH=20

# QC
RUN_FASTQSCREEN="true"
FASTQSCREEN_CONF="/absolute/path/to/fastq_screen.conf"
RUN_RSEQC="true"
RSEQC_BIN_DIR=""                 # empty means use PATH
STRAND_TOLERANCE_PCT="5"

# Differential expression and enrichment
RUN_DE="true"
RUN_ENRICHMENT="true"
DESIGN_FORMULA="~ condition"
PADJ_THRESHOLD="0.05"
LFC_THRESHOLD="1"
DE_PADJ_THRESHOLD="0.05"
DE_LFC_THRESHOLD="1"
ENRICHMENT_MINGS=10
ENRICHMENT_MAXGS=500

# Tracks
MERGE_CONDITION_TRACKS="true"
UCSC_TRACKS="true"
# Leave empty to skip public URLs; descriptor generation needs a real URL.
UCSC_BASE_URL=""

# Resume and cleanup
FORCE_RERUN=0
CLEANUP_INTERMEDIATES=0
CLEANUP_DRYRUN=0
CLEANUP_ALLCHR_BEDGRAPH=0

# Tool names normally require no editing in an installed release.
PYTHON_BIN="python"
FASTQC_BIN="fastqc"
MULTIQC_BIN="multiqc"
RSCRIPT_BIN="Rscript"
